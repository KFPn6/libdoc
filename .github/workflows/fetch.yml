name: Fetch Library Data

on:
  workflow_dispatch:
  # main への push（PR マージ含む）でも再生成・再デプロイする。
  # docs/index.html は gitignore のため、ブランチ由来の Pages 再ビルドだと空になるのを防ぐ。
  push:
    branches:
      - main
  schedule:
    # 日本時間 6時 = UTC 21:00
    - cron: "0 21 * * *"
    # 日本時間 12時 = UTC 03:00
    - cron: "0 3 * * *"
    # 日本時間 15時 = UTC 06:00
    - cron: "0 6 * * *"
    # 日本時間 18時 = UTC 09:00
    - cron: "0 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci && npx playwright install --with-deps chromium

      - run: npm run fetch-and-build
        env:
          LIBRARY_ACCOUNTS: ${{ secrets.LIBRARY_ACCOUNTS }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
