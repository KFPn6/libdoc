name: Fetch Library Data

on:
  workflow_dispatch:
  # main への push（PR マージ含む）でも再生成・再デプロイする。
  # docs/index.html は gitignore のため、ブランチ由来の Pages 再ビルドだと空になるのを防ぐ。
  push:
    branches:
      - main
  schedule:
    # 公開リポジトリでは GitHub Actions の schedule が数時間遅れるため、
    # cron は目標時刻より早めに設定し、実行がおおよそ JST 6/12/15/18 時になるようにする。
    # 目標 ~6時 JST（遅れ約2時間想定）→ JST 4時 = UTC 19:00
    - cron: "0 19 * * *"
    # 目標 ~12時 JST（遅れ約2〜3時間想定）→ JST 9時 = UTC 00:00
    - cron: "0 0 * * *"
    # 目標 ~15時 JST → JST 11時 = UTC 02:00
    - cron: "0 2 * * *"
    # 目標 ~18時 JST → JST 13時 = UTC 04:00
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci && npx playwright install --with-deps chromium

      - run: npm run fetch-and-build
        env:
          LIBRARY_ACCOUNTS: ${{ secrets.LIBRARY_ACCOUNTS }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
