name: Fetch Library Data

on:
  workflow_dispatch:
  # main への push（PR マージ含む）でも再生成・再デプロイする。
  # docs/index.html は gitignore のため、ブランチ由来の Pages 再ビルドだと空になるのを防ぐ。
  push:
    branches:
      - main
  schedule:
    # 公開リポジトリでは GitHub Actions の schedule が数時間遅れるため、
    # cron は目標より早めに設定する（2026-11 実測: 中央値おおよそ 4〜4.5 時間遅れ）。
    # 目標 ~8時 JST（遅れ約4時間想定）→ JST 4時 = UTC 19:00
    - cron: "0 19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci && npx playwright install --with-deps chromium

      - run: npm run fetch-and-build
        env:
          LIBRARY_ACCOUNTS: ${{ secrets.LIBRARY_ACCOUNTS }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
